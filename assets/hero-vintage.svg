<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-label="Vintage Japanese woodblock-inspired landscape with Mount Fuji, a pagoda and moon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7e0dc"/>
      <stop offset="0.48" stop-color="#dce2dc"/>
      <stop offset="0.78" stop-color="#e8d9c2"/>
      <stop offset="1" stop-color="#c8896e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#557784"/>
      <stop offset="1" stop-color="#263f4c"/>
    </linearGradient>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="grain">
        <feFuncA type="table" tableValues="0 0.13"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
  </defs>
  <rect width="1800" height="1100" fill="#eee3d0"/>
  <g filter="url(#paper)">
    <!-- sky wash -->
    <rect width="1800" height="720" fill="url(#sky)"/>
    <!-- moon -->
    <circle cx="1320" cy="250" r="86" fill="#e9d5ad" opacity="0.95"/>
    <circle cx="1298" cy="228" r="78" fill="#dce2dc" opacity="0.55"/>
    <!-- distant ridge -->
    <path d="M0 660 C180 615 320 590 470 625 C610 658 730 650 850 610 C1000 560 1120 570 1240 625 C1380 690 1510 670 1800 610 L1800 790 L0 790Z" fill="#6b7773" opacity="0.55"/>
    <!-- Mount Fuji -->
    <path d="M430 675 L760 270 L1095 675 Z" fill="#506c76"/>
    <path d="M760 270 L828 372 L789 355 L758 405 L724 356 L686 389 Z" fill="#e7e0d0"/>
    <path d="M430 675 L760 270 L1095 675" fill="none" stroke="#294653" stroke-width="11" opacity="0.7"/>
    <!-- foreground hills -->
    <path d="M0 735 C220 650 380 705 550 748 C720 790 850 740 1020 700 C1210 656 1390 695 1800 760 L1800 1100 L0 1100Z" fill="#324f5d"/>
    <path d="M0 785 C230 710 390 775 570 820 C760 867 905 795 1085 760 C1280 722 1460 770 1800 815 L1800 1100 L0 1100Z" fill="#243d4a"/>
    <!-- river / water -->
    <path d="M1120 760 C1000 830 980 895 1080 1100 L1800 1100 L1800 840 C1510 790 1335 770 1120 760Z" fill="url(#water)"/>
    <g fill="none" stroke="#8ea1a2" stroke-width="7" opacity="0.6">
      <path d="M1110 835 C1260 815 1450 855 1690 880"/>
      <path d="M1080 890 C1280 865 1510 915 1780 940"/>
      <path d="M1060 955 C1270 935 1500 980 1760 1000"/>
      <path d="M1055 1020 C1280 1005 1510 1040 1750 1060"/>
    </g>
    <!-- pagoda -->
    <g transform="translate(1180 420)" fill="#a96c4d" stroke="#6d3f33" stroke-width="6">
      <path d="M75 330 L75 170 L55 170 L95 125 L135 170 L115 170 L115 330 Z"/>
      <path d="M42 155 L148 155 L125 135 L65 135 Z"/>
      <path d="M28 124 L162 124 L132 101 L58 101 Z"/>
      <path d="M50 93 L140 93 L121 73 L69 73 Z"/>
      <path d="M68 64 L122 64 L108 45 L82 45 Z"/>
      <path d="M95 45 L95 8 L101 8 L101 45 Z"/>
      <rect x="93" y="195" width="12" height="44" fill="#e3c58d" stroke="none"/>
      <path d="M72 330 L72 280 L118 280 L118 330" fill="#243d4a"/>
    </g>
    <!-- pine framing -->
    <g stroke="#182d36" stroke-linecap="round" fill="none">
      <path d="M115 0 C135 240 90 510 155 790 C180 890 150 1000 112 1100" stroke-width="30"/>
      <path d="M160 185 C290 110 370 130 470 180" stroke-width="16"/>
      <path d="M145 310 C250 250 330 275 390 320" stroke-width="14"/>
      <path d="M155 460 C255 395 330 430 410 490" stroke-width="12"/>
      <path d="M1640 0 C1610 220 1660 450 1605 690 C1580 790 1605 920 1660 1100" stroke-width="32"/>
      <path d="M1605 175 C1510 105 1420 130 1340 190" stroke-width="15"/>
      <path d="M1610 330 C1510 255 1435 290 1370 350" stroke-width="13"/>
      <path d="M1600 480 C1510 415 1430 450 1360 505" stroke-width="11"/>
    </g>
    <!-- pine needles as restrained brush marks -->
    <g stroke="#263f4c" stroke-width="7" opacity="0.9">
      <path d="M220 175 l-65 -38 M255 155 l-70 -10 M292 160 l-62 22 M330 190 l-62 48"/>
      <path d="M1510 155 l65 -35 M1470 160 l75 8 M1430 190 l65 38 M1390 220 l60 42"/>
    </g>
    <!-- warm cartouche -->
    <g transform="translate(1510 120)">
      <rect width="128" height="190" fill="#a65b49" opacity="0.95"/>
      <rect x="10" y="10" width="108" height="170" fill="none" stroke="#e5c58b" stroke-width="3"/>
      <text x="64" y="55" text-anchor="middle" font-family="serif" font-size="25" fill="#efe3d0">東</text>
      <text x="64" y="92" text-anchor="middle" font-family="serif" font-size="25" fill="#efe3d0">京</text>
      <text x="64" y="129" text-anchor="middle" font-family="serif" font-size="25" fill="#efe3d0">景</text>
    </g>
    <!-- small red seal -->
    <rect x="92" y="870" width="78" height="78" fill="#9b4335"/>
    <path d="M110 890 h42 v42 h-42z" fill="none" stroke="#ead5b4" stroke-width="3"/>
    <text x="131" y="918" text-anchor="middle" font-family="serif" font-size="19" fill="#ead5b4">禅</text>
  </g>
  <rect x="18" y="18" width="1764" height="1064" fill="none" stroke="#d7c5a5" stroke-width="4" opacity="0.7"/>
</svg>
